name: Deploy Batch 15 prospect demos

on:
  push:
    branches: [main]
    paths:
      - 'batch-15-payload/**'
      - '.github/workflows/deploy-batch-15.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Batch 15 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode batch-15-payload/payload.b64 > /tmp/batch-15.tar.gz
          gzip -t /tmp/batch-15.tar.gz
          tar -xzf /tmp/batch-15.tar.gz
          rm -rf batch-15-payload

      - name: Merge Batch 15 outreach log
        shell: bash
        run: |
          python - <<'PYMERGE'
          import csv
          from pathlib import Path

          master = Path('outreach-log.csv')
          batch = Path('outreach-log-batch-15.csv')
          if not batch.exists():
              raise SystemExit('Missing outreach-log-batch-15.csv')

          with batch.open(newline='', encoding='utf-8-sig') as f:
              incoming = list(csv.DictReader(f))
          existing = []
          fields = list(incoming[0].keys()) if incoming else []
          if master.exists():
              with master.open(newline='', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  existing = list(reader)
                  fields = reader.fieldnames or fields
          for row in incoming:
              for key in row:
                  if key not in fields:
                      fields.append(key)
          index = {
              row.get('Normalised root domain', '').strip().lower(): i
              for i, row in enumerate(existing)
              if row.get('Normalised root domain', '').strip()
          }
          for row in incoming:
              domain = row.get('Normalised root domain', '').strip().lower()
              clean = {key: row.get(key, '') for key in fields}
              if domain in index:
                  existing[index[domain]].update(clean)
              elif domain:
                  index[domain] = len(existing)
                  existing.append(clean)
          with master.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(existing)
          PYMERGE

      - name: Persist Batch 15 source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mda-growth-systems"
          git config user.email "michael@mdagrowthsystems.info"
          git add -A
          git commit -m "Persist Batch 15 prospect demos [skip ci]" || true
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Batch 15 public pages
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          paths=(
            prospects/ice-drainage/
            prospects/anglia-solar/
            prospects/industrial-doors-north-west/
            prospects/nts-commercial-kitchens/
            prospects/cdf-management-group/
            prospects/engetech-cold-rooms/
            prospects/uk-cabling/
            prospects/total-air-solutions/
            prospects/rwr-commercial/
            prospects/uk-pump-maintenance/
          )
          sleep 60
          {
            echo "Batch 15 GitHub Pages verification"
            echo "Deployment: $base"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Verified UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > pages-verification-batch-15.txt
          for path in "${paths[@]}"; do
            url="${base%/}/$path"
            curl --fail --silent --show-error --location --retry 30 --retry-delay 5 --retry-all-errors "${url}index.html" >/dev/null
            curl --fail --silent --show-error --location --retry 20 --retry-delay 4 --retry-all-errors "$url" >/dev/null
            curl --fail --silent --show-error --location --retry 20 --retry-delay 4 --retry-all-errors "${url}thank-you.html" >/dev/null
            echo "PASS $url" >> pages-verification-batch-15.txt
          done
          curl --fail --silent --show-error --location --retry 20 --retry-delay 4 --retry-all-errors "${base%/}/batch-15.html" >/dev/null
          echo "PASS ${base%/}/batch-15.html" >> pages-verification-batch-15.txt
          curl --fail --silent --show-error --location --retry 15 --retry-delay 4 --retry-all-errors "https://mdagrowthsystems.com/" >/dev/null
          echo "PASS https://mdagrowthsystems.com/" >> pages-verification-batch-15.txt

      - name: Mark public-link verification complete
        shell: bash
        run: |
          python - <<'PYSTATUS'
          import csv
          from pathlib import Path

          verification = Path('pages-verification-batch-15.txt').read_text(encoding='utf-8')
          verified_line = next((line for line in verification.splitlines() if line.startswith('Verified UTC:')), 'Verified UTC: recorded by GitHub Actions')
          verified = verified_line.replace('Verified UTC:', '').strip()
          pending = 'Status: Public-link testing required after GitHub deployment.'
          complete = f'Status: Public links verified by signed-out HTTPS requests in GitHub Actions on {verified}.'
          for path in Path('prospects').glob('*/outreach-email.txt'):
              path.write_text(path.read_text(encoding='utf-8').replace(pending, complete), encoding='utf-8')
          for path in Path('prospects').glob('*/follow-up-email.txt'):
              path.write_text(path.read_text(encoding='utf-8').replace(pending, complete), encoding='utf-8')
          for path in Path('prospects').glob('*/qa-checklist.txt'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('[ ] Public URL verified signed out', '[x] Public URL verified signed out by GitHub Actions')
              path.write_text(text, encoding='utf-8')

          report = Path('BATCH-15-FINAL-REPORT.md')
          if report.exists():
              text = report.read_text(encoding='utf-8')
              text = text.replace('Status: Publication and Gmail drafting pending.', 'Status: Ten public demo links verified; Gmail drafting pending.')
              report.write_text(text, encoding='utf-8')

          master = Path('outreach-log.csv')
          if master.exists():
              with master.open(newline='', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)
                  fields = reader.fieldnames or []
              targets = {
                  'icedrainage.co.uk','angliasolar.co.uk','idnw.co.uk','ntsltd.uk','cdfmgroup.co.uk',
                  'engetech.co.uk','ukcabling.com','totalairsolutions.co.uk','rwrcommercial.co.uk','ukpumpmaintenance.com'
              }
              for row in rows:
                  if row.get('Normalised root domain', '').strip().lower() in targets:
                      row['Demo status'] = 'Published on GitHub Pages; signed-out HTTPS verification passed'
                      row['Website QA status'] = 'Static QA passed; public URL and thank-you page verified'
                      row['Link QA status'] = 'Prospect demo and MDA website links verified'
              with master.open('w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                  writer.writeheader()
                  writer.writerows(rows)
          PYSTATUS

      - name: Save Batch 15 verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mda-growth-systems"
          git config user.email "michael@mdagrowthsystems.info"
          git add -A
          git commit -m "Verify Batch 15 public pages [skip ci]" || true
          git pull --rebase
          git push
