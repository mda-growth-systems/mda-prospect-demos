name: Deploy prospect demos to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - pages-verification-batch-06.txt
      - pages-verification-batch-07.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand Batch 07 payload when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d batch-07-payload ]; then
            cat batch-07-payload/part-* > /tmp/batch-07.tar.gz.b64
            base64 --decode /tmp/batch-07.tar.gz.b64 > /tmp/batch-07.tar.gz
            tar -xzf /tmp/batch-07.tar.gz
            rm -rf batch-07-payload
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify Batch 07 public pages
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          paths=(
            prospects/ipro-hire/
            prospects/boss-roofing-cladding/
            prospects/uk-lift-escalator/
            prospects/seward-refrigeration/
            prospects/hydrop-ecs/
            prospects/fire-alert-uk/
            prospects/falcon-security-systems/
            prospects/gecko-electrical/
            prospects/nova-renewables/
            prospects/independent-logistics-solutions/
          )
          sleep 20
          {
            echo "Batch 07 GitHub Pages verification"
            echo "Deployment: $base"
            echo "Commit: $GITHUB_SHA"
            echo "Verified UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > pages-verification-batch-07.txt
          for path in "${paths[@]}"; do
            url="${base%/}/$path"
            curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$url" >/dev/null
            echo "PASS $url" >> pages-verification-batch-07.txt
          done

      - name: Save expanded Batch 07 folders and verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mda-growth-systems"
          git config user.email "michael@mdagrowthsystems.info"
          git add -A prospects pages-verification-batch-07.txt batch-07-payload .github/workflows/deploy-pages.yml 2>/dev/null || true
          git add -A
          git commit -m "Publish and verify Batch 07 prospect websites [skip ci]" || exit 0
          git push
