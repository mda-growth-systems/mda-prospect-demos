name: Deploy prospect demos to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - pages-verification-batch-06.txt
      - pages-verification-batch-07.txt
      - pages-verification-batch-08.txt
      - pages-verification-batch-09.txt
      - pages-verification-batch-10.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand and save Batch 10 payload
        shell: bash
        run: |
          set -euo pipefail
          if [ -d batch-10-payload ]; then
            cat batch-10-payload/part-* > /tmp/batch-10-payload.tar.gz.b64
            base64 --decode /tmp/batch-10-payload.tar.gz.b64 > /tmp/batch-10-payload.tar.gz
            tar -xzf /tmp/batch-10-payload.tar.gz
            rm -rf batch-10-payload
            python - <<'PY'
          import csv
          from pathlib import Path
          master=Path('outreach-log.csv')
          batch=Path('outreach-log-batch-10.csv')
          if batch.exists():
              with batch.open(newline='',encoding='utf-8-sig') as f:
                  incoming=list(csv.DictReader(f))
              existing=[]
              fields=list(incoming[0].keys()) if incoming else []
              if master.exists():
                  with master.open(newline='',encoding='utf-8-sig') as f:
                      reader=csv.DictReader(f)
                      existing=list(reader)
                      fields=reader.fieldnames or fields
              for row in incoming:
                  for key in row:
                      if key not in fields:
                          fields.append(key)
              index={r.get('Normalised root domain','').strip().lower():i for i,r in enumerate(existing)}
              for row in incoming:
                  domain=row.get('Normalised root domain','').strip().lower()
                  clean={k:row.get(k,'') for k in fields}
                  if domain in index:
                      existing[index[domain]].update(clean)
                  elif domain:
                      index[domain]=len(existing)
                      existing.append(clean)
              with master.open('w',newline='',encoding='utf-8') as f:
                  writer=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore')
                  writer.writeheader(); writer.writerows(existing)
          PY
            git config user.name "mda-growth-systems"
            git config user.email "michael@mdagrowthsystems.info"
            git add -A
            git commit -m "Add Batch 10 prospect demos and outreach records [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify Batch 10 public pages
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          paths=(
            prospects/excel-automatic-doors/
            prospects/a2m-tec/
            prospects/nicad/
            prospects/braywhite-hvac/
            prospects/k-plant-hire/
            prospects/rs-surveys/
            prospects/laser-surveys/
            prospects/eclipse-event-production/
            prospects/thames-fire/
            prospects/guardian-hygiene/
          )
          sleep 30
          {
            echo "Batch 10 GitHub Pages verification"
            echo "Deployment: $base"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Verified UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > pages-verification-batch-10.txt
          for path in "${paths[@]}"; do
            url="${base%/}/$path"
            curl --fail --silent --show-error --location --retry 20 --retry-delay 5 --retry-all-errors "$url" >/dev/null
            curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "${url}thank-you.html" >/dev/null
            echo "PASS $url" >> pages-verification-batch-10.txt
          done
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "https://mdagrowthsystems.com/" >/dev/null
          echo "PASS https://mdagrowthsystems.com/" >> pages-verification-batch-10.txt

      - name: Save Batch 10 verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mda-growth-systems"
          git config user.email "michael@mdagrowthsystems.info"
          git add pages-verification-batch-10.txt
          git commit -m "Verify Batch 10 public pages [skip ci]" || exit 0
          git push
