name: Expand Batch 02 prospect websites on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expand-batch-02-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-02-upload/part*.txt > /tmp/mda-batch-02.b64
          base64 --decode /tmp/mda-batch-02.b64 > /tmp/mda-batch-02.tar.gz
          tar -xzf /tmp/mda-batch-02.tar.gz
          test -f prospects/esk-industrial-roofing/index.html
          test -f prospects/sabreglen-cooling/index.html
          test -f prospects/cambridge-lifts/index.html
          test -f prospects/clearview-surveys/index.html
          test -f prospects/camtec-security/index.html
          test -f prospects/auto-door-specialists/index.html
          rm -rf .batch-02-upload
          rm -f .github/workflows/expand-batch-02.yml
          rm -f .github/workflows/expand-batch-02-main.yml

      - name: Commit expanded Batch 02 websites
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Batch 02 prospect website source files"
          git push origin main

# Triggered directly on main after PR merge.
