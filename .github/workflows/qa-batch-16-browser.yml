name: QA Batch 16 in browser
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-batch-16-browser.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.54.2
      - name: Test desktop tablet mobile and forms
        shell: bash
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          const base='https://mda-growth-systems.github.io/mda-prospect-demos/prospects';
          const slugs=['strike-control','hendon-glazing','automatic-sprinkler-solutions','critical-environment-solutions','lab-uk-asbestos','thor-safety','sea-uk-gate-automation','grease-trap-store','procter-brothers','ltc-fencing'];
          const viewports=[['desktop',1440,900],['tablet',768,1024],['mobile',390,844]];
          let executable;
          for (const c of ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium']) if(fs.existsSync(c)){executable=c;break;}
          if(!executable) throw new Error('No Chrome/Chromium executable found');
          const browser=await chromium.launch({executablePath:executable,headless:true,args:['--no-sandbox']});
          const results=[];
          for(const slug of slugs){
            const r={slug,passes:[],failures:[]};
            for(const [label,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage(); const errors=[];
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              page.on('pageerror',e=>errors.push(String(e)));
              try{
                const response=await page.goto(`${base}/${slug}/`,{waitUntil:'networkidle',timeout:30000});
                if(!response?.ok()) r.failures.push(`${label}: HTTP ${response?.status()}`);
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) r.failures.push(`${label}: horizontal overflow`);
                if(!(await page.locator('h1').first().isVisible())) r.failures.push(`${label}: visible h1 missing`);
                const body=(await page.locator('body').innerText()).toLowerCase();
                if(!body.includes('unofficial')||!body.includes('concept')) r.failures.push(`${label}: disclaimer missing`);
                const hrefs=await page.locator('a').evaluateAll(es=>es.map(e=>e.getAttribute('href')).filter(Boolean));
                if(!hrefs.some(x=>x.startsWith('mailto:'))) r.failures.push(`${label}: mailto missing`);
                if(!hrefs.some(x=>x.startsWith('tel:'))) r.failures.push(`${label}: tel missing`);
                const badAnchors=await page.locator('a[href^="#"]').evaluateAll(es=>es.map(e=>e.getAttribute('href')).filter(h=>h&&h!=='#'&&!document.querySelector(h)));
                for(const h of badAnchors) r.failures.push(`${label}: missing anchor ${h}`);
                if(errors.length) r.failures.push(`${label}: console errors ${errors.slice(0,2).join(' | ')}`);
                r.passes.push(`${label}: load/layout/links`);
              }catch(e){r.failures.push(`${label}: ${e.message}`)}
              await context.close();
            }
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage(); const errors=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())}); page.on('pageerror',e=>errors.push(String(e)));
            try{
              await page.goto(`${base}/${slug}/`,{waitUntil:'networkidle',timeout:30000});
              const form=page.locator('form').first();
              if(await form.count()===0) r.failures.push('form: missing');
              else{
                const submit=form.locator('button[type="submit"],input[type="submit"],button').last();
                await submit.click();
                if(await page.locator(':invalid').count()===0) r.failures.push('form: native required validation missing');
                for(const sel of await form.locator('select').all()){if(await sel.locator('option').count()>1) await sel.selectOption({index:1});}
                for(const input of await form.locator('input').all()){
                  const t=((await input.getAttribute('type'))||'text').toLowerCase();
                  if(['submit','button','hidden'].includes(t)) continue;
                  if(['checkbox','radio'].includes(t)){await input.check();continue;}
                  await input.fill(t==='email'?'test@example.com':t==='tel'?'07123456789':'Test');
                }
                for(const ta of await form.locator('textarea').all()) await ta.fill('Test enquiry');
                await submit.click();
                await page.waitForURL(/thank-you\.html/,{timeout:15000});
                if(!(await page.locator('body').innerText()).trim()) r.failures.push('form: blank confirmation');
                else r.passes.push('form: validation and confirmation');
                if(errors.length) r.failures.push(`form: console errors ${errors.slice(0,2).join(' | ')}`);
              }
            }catch(e){r.failures.push(`form: ${e.message}`)}
            await context.close(); results.push(r);
          }
          await browser.close();
          const ok=results.every(r=>r.failures.length===0);
          fs.writeFileSync('browser-qa-batch-16.json',JSON.stringify({ok,verified_utc:new Date().toISOString(),results},null,2));
          let md=`# Batch 16 browser QA\n\nVerified UTC: ${new Date().toISOString()}\n\nOverall: **${ok?'PASS':'FAIL'}**\n\n| Demo | Desktop | Tablet | Mobile | Form | Result |\n|---|---|---|---|---|---|\n`;
          for(const r of results) md+=`| ${r.slug} | ${r.failures.some(x=>x.startsWith('desktop'))?'FAIL':'PASS'} | ${r.failures.some(x=>x.startsWith('tablet'))?'FAIL':'PASS'} | ${r.failures.some(x=>x.startsWith('mobile'))?'FAIL':'PASS'} | ${r.failures.some(x=>x.startsWith('form'))?'FAIL':'PASS'} | ${r.failures.length?'FAIL':'PASS'} |\n`;
          if(!ok){md+='\n## Failures\n'; for(const r of results) for(const f of r.failures) md+=`- ${r.slug}: ${f}\n`;}
          fs.writeFileSync('browser-qa-batch-16.md',md);
          if(!ok) process.exit(2);
          JS
          node /tmp/qa.mjs
      - name: Persist QA evidence
        if: always()
        run: |
          git config user.name mda-growth-systems
          git config user.email michael@mdagrowthsystems.info
          git add browser-qa-batch-16.json browser-qa-batch-16.md
          git commit -m 'Record Batch 16 browser QA [skip ci]' || true
          git pull --rebase
          git push
