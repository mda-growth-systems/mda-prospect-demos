name: Unpack prospect demo batch

on:
  push:
    branches:
      - prospect-demo-batch-01

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: prospect-demo-batch-01
          fetch-depth: 0

      - name: Expand staged batch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .batch-upload ]; then
            echo "No staged batch remains."
            exit 0
          fi
          cat .batch-upload/part00 .batch-upload/part01 .batch-upload/part02 .batch-upload/part03 > /tmp/mda-prospect-batch-01.tar.gz
          tar -xzf /tmp/mda-prospect-batch-01.tar.gz -C .
          rm -rf .batch-upload

      - name: Commit expanded prospect folders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expansion changes to commit."
            exit 0
          fi
          git commit -m "Add six verified prospect demo projects"
          git push origin prospect-demo-batch-01
