name: Verify Batch 02 GitHub Pages sites

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-batch-02-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public Batch 02 pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/esk-industrial-roofing/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/sabreglen-cooling/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/cambridge-lifts/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/clearview-surveys/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/camtec-security/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/auto-door-specialists/"
          )
          : > pages-verification-batch-02.txt
          printf 'Batch 02 GitHub Pages verification\nVerified in UTC: %s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> pages-verification-batch-02.txt
          for url in "${urls[@]}"; do
            ok=0
            for attempt in $(seq 1 48); do
              if curl --location --silent --show-error --fail --max-time 20 "$url" >/dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then echo "Public verification failed: $url" >&2; exit 1; fi
            printf 'PASS %s\n' "$url" >> pages-verification-batch-02.txt
          done
          rm .github/workflows/verify-batch-02-pages.yml

      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-verification-batch-02.txt .github/workflows/verify-batch-02-pages.yml
          git commit -m "Verify Batch 02 public GitHub Pages websites"
          git push origin main
