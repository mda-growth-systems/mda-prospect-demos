name: Verify Batch 03 GitHub Pages sites
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-batch-03-pages.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ruan-vv.github.io/mda-prospect-demos/batch-03.html"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/independent-fire-safety/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/creative-lifts-walsall/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/tj-plant-hire/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/cannock-sound/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/ides-electrical/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/mg-drainage/"
          )
          : > pages-verification-batch-03.txt
          printf 'Batch 03 GitHub Pages verification\nVerified in UTC: %s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> pages-verification-batch-03.txt
          for url in "${urls[@]}"; do
            ok=0
            for attempt in $(seq 1 48); do
              if curl -Lsf --max-time 20 "$url" >/dev/null; then ok=1; break; fi
              sleep 5
            done
            test "$ok" -eq 1 || { echo "FAILED $url" >&2; exit 1; }
            printf 'PASS %s\n' "$url" >> pages-verification-batch-03.txt
          done
          rm .github/workflows/verify-batch-03-pages.yml
      - name: Commit verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-verification-batch-03.txt .github/workflows/verify-batch-03-pages.yml
          git commit -m "Verify Batch 03 public GitHub Pages websites"
          git push origin main
