name: Verify Batch 16 public pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-batch-16-only.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact public URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://mda-growth-systems.github.io/mda-prospect-demos'
          slugs=(strike-control hendon-glazing automatic-sprinkler-solutions critical-environment-solutions lab-uk-asbestos thor-safety sea-uk-gate-automation grease-trap-store procter-brothers ltc-fencing)
          printf 'Batch 16 public verification\nVerified UTC: %s\n\n' "$(date -u +%FT%TZ)" > pages-verification-batch-16.txt
          for s in "${slugs[@]}"; do
            u="$base/prospects/$s/"
            curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$u" >/dev/null
            curl -fsSL --retry 6 --retry-delay 4 --retry-all-errors "${u}thank-you.html" >/dev/null
            echo "PASS $u" >> pages-verification-batch-16.txt
          done
          curl -fsSL --retry 6 --retry-delay 4 --retry-all-errors https://mdagrowthsystems.com/ >/dev/null
          echo 'PASS https://mdagrowthsystems.com/' >> pages-verification-batch-16.txt
          git config user.name mda-growth-systems
          git config user.email michael@mdagrowthsystems.info
          git add pages-verification-batch-16.txt
          git commit -m 'Verify Batch 16 public pages [skip ci]' || true
          git pull --rebase
          git push
