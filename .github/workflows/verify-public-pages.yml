name: Verify public GitHub Pages sites

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-public-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ruan-vv.github.io/mda-prospect-demos/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/cc-door-systems/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/abbey-fire-protection/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/refrigeration-uk/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/water-hygiene-services/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/mph-elec-services/"
            "https://ruan-vv.github.io/mda-prospect-demos/prospects/aj-industrial-roofing/"
          )

          : > pages-verification.txt
          printf 'GitHub Pages verification\nVerified by GitHub Actions in UTC: %s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> pages-verification.txt

          for url in "${urls[@]}"; do
            ok=0
            for attempt in $(seq 1 36); do
              if curl --location --silent --show-error --fail --max-time 20 "$url" >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Public verification failed: $url" >&2
              exit 1
            fi
            printf 'PASS %s\n' "$url" >> pages-verification.txt
          done

          rm .github/workflows/verify-public-pages.yml

      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-verification.txt .github/workflows/verify-public-pages.yml
          git commit -m "Verify public GitHub Pages websites"
          git push origin main
